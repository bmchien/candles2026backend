# Optional local PostgreSQL for development and e2e tests (production uses Neon).
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ecommerce
#   TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ecommerce_test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
